<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mcpinterlock</title>
<style>:root{color-scheme:dark;--bg:#080b0e;--panel:#10161b;--line:#28323a;--text:#edf3f1;--muted:#93a1a8;--accent:#ff9b73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1180px)/2))}h1{font-size:17px;margin:0}.status{color:var(--accent)}main{max-width:1180px;margin:auto;padding:34px 24px 56px}.intro{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end;margin-bottom:28px}h2{font:650 36px/1.08 system-ui,sans-serif;margin:0;max-width:700px}.intro p{color:var(--muted);margin:0}.workspace{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);min-height:520px}.pane{padding:20px;min-width:0}.pane+ .pane{border-left:1px solid var(--line)}.label{color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:10px}textarea,pre{width:100%;height:390px;margin:0;border:1px solid var(--line);background:#06090b;color:var(--text);padding:14px;font:12px/1.55 inherit;overflow:auto;white-space:pre-wrap;border-radius:2px}textarea:focus{outline:1px solid var(--accent)}button{height:42px;margin-top:14px;border:0;border-radius:2px;padding:0 18px;background:var(--accent);color:#07100d;font:700 13px inherit;cursor:pointer}pre{color:var(--accent)}.error{color:#ff827b}@media(max-width:760px){main{padding:24px 16px}.intro{grid-template-columns:1fr;gap:12px}h2{font-size:29px}.workspace{grid-template-columns:1fr}.pane+ .pane{border-left:0;border-top:1px solid var(--line)}textarea,pre{height:320px}header{padding:0 16px}}</style></head>
<body><header><h1>mcpinterlock / workbench</h1><span class="status">● local</span></header><main><section class="intro"><h2>A tool call is a privilege request.</h2><p>Enforce tool allowlists, path boundaries, destructive approvals, secret checks, and SSRF controls.</p></section><section class="workspace"><div class="pane"><div class="label">Analysis input</div><textarea id="input"></textarea><button id="run">Run analysis</button></div><div class="pane"><div class="label">Checkable result</div><pre id="result">Loading demo…</pre></div></section></main>
<script>const input=document.querySelector('#input'),result=document.querySelector('#result');async function demo(){const data=await fetch('/api/demo').then(r=>r.json());input.value=JSON.stringify(data.input,null,2);result.textContent=JSON.stringify(data.result,null,2)}async function run(){try{const response=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:input.value});const data=await response.json();result.className=data.error?'error':'';result.textContent=JSON.stringify(data,null,2)}catch(error){result.className='error';result.textContent=error.message}}document.querySelector('#run').onclick=run;demo();</script></body></html>
